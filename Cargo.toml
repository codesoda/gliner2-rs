[package]
name = "gliner2-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"

[dependencies]
anyhow = "1"
ndarray = "0.16"
once_cell = "1"
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "tracing", "download-binaries", "tls-rustls", "copy-dylibs", "api-27"] }
tokenizers = "0.21"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hf-hub = { version = "1.0.0", features = ["blocking"] }

[dev-dependencies]
ndarray-npy = "0.9"
tempfile = "3"
